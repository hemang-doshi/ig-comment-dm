name = "ig-comment-dm"
main = "src/index.ts"
compatibility_date = "2026-08-14"
# Do not enable nodejs_compat. Web Crypto (crypto.subtle) only.
# Do not set [limits] cpu_ms — that is paid Workers only and deploy fails on Free.

# No database_id on purpose. The first `wrangler deploy` creates a D1 database
# with this name (or reuses one that already has it), and later deploys and
# `wrangler d1` commands look it up by name, so a fresh clone deploys with no
# edits. Wrangler does not write the id back here: it skips that for any TOML
# config with comments in it. If you add the id by hand, do not commit it.
[[d1_databases]]
binding = "DB"
database_name = "ig-comment-dm"
# `wrangler d1 migrations apply` runs each file here once, in filename order, and
# records it in the d1_migrations table. The integration tests read this too.
migrations_dir = "migrations"

# The daily job (token refresh, totals), and the minute job, which sends the
# queue and polls for missed comments every fifth minute. Two of the free
# plan's five cron triggers per account.
[triggers]
crons = ["0 3 * * *", "* * * * *"]

# Meta Unified login (apps created since late Oct 2026). Public, not a secret:
# the Facebook Login for Business configuration id from Use cases → Instagram API
# → API setup with Unified login. Remove it to use classic Instagram Login.
[vars]
META_LOGIN_CONFIG_ID = "YOUR_LOGIN_CONFIG_ID"
# "on": logging in lands on the dashboard app (/a/<secret>/app). Anything else: the classic pages.
DASHBOARD = "on"

# The dashboard app (web/), built by `npm run build:web` into web/dist and
# served under /app-static/. Requests for any other path reach the Worker.
[assets]
directory = "./web/dist"
binding = "ASSETS"
